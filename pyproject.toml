[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackz"
version = "0.1.0"
description = "A generic framework for building AI-powered multimodal tracking applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matej" }
]
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trackz*"]
